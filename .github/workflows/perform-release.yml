name: perform-release

# Must be triggered from a release/v* branch.
# merge into main → tag → delete release branch → merge main into develop → publish Maven Central.
# pom.xml stays at <version>0</version> in git — the real version is injected only for the Maven deploy.

on:
  workflow_dispatch:

jobs:
  perform-release:
    name: Perform release (merge → tag → back-merge → publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate branch name
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^release/v.+ ]]; then
            echo "::error::This workflow must be triggered from a release/v* branch (got: ${{ github.ref_name }})"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main:main develop:develop

      - name: Extract release version
        id: version
        run: |
          RELEASE_BRANCH="${{ github.ref_name }}"
          NEW_VERSION="${RELEASE_BRANCH#release/}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Merge release branch into main and tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          RELEASE_BRANCH="${{ steps.version.outputs.release_branch }}"
          git checkout main
          git merge "$RELEASE_BRANCH" -m "Merge $RELEASE_BRANCH into main"
          git push origin main
          git tag -a -m "Tagging for release $NEW_VERSION" "$NEW_VERSION"
          git push origin "$NEW_VERSION"

      - name: Delete release branch
        run: git push origin --delete "${{ steps.version.outputs.release_branch }}"

      - name: Merge main back into develop
        run: |
          git checkout develop
          git merge main -m "Merge main into develop after release ${{ steps.version.outputs.new_version }}"
          git push origin develop

      - name: Checkout tag for building
        run: git checkout "${{ steps.version.outputs.new_version }}"

      - name: Inject version into pom.xml (no commit)
        run: mvn versions:set -DnewVersion="${{ steps.version.outputs.version_number }}" -DgenerateBackupPoms=false

      - name: Run the Maven deploy phase
        run: mvn --batch-mode deploy
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          AUTO_RELEASE_AFTER_CLOSE: true